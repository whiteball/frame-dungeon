- name: iron sword
  label: 鉄の剣
  type: weapon
  effect:
    power: 15
  description: 一般的な鉄の剣
- name: round shield
  label: 丸い盾
  type: main_armor
  effect:
    defense: 10
  description: 丸い板を鉄で補強した盾
- name: silver ring
  label: 銀の指輪
  type: sub_armor
  effect:
    defense: 10
  description: 銀でできた綺麗な指輪
- name: potion
  label: 薬
  type: consumable
  effect:
    immediate:
      life: 30
  description: 傷を治す薬
- name: mana potion
  label: 魔法の薬
  type: consumable
  effect:
    immediate:
      magic: 30
  description: MPを回復する薬
- name: power potion
  label: 力の薬
  type: consumable
  effect:
    continuous:
      turns: 5
      power: 10
  description: 一時的に力を高める薬
- name: poison potion
  label: 毒薬
  type: consumable
  effect:
    immediate:
      applyEffect: poison
  description: 飲むと毒状態になる怪しい瓶
- name: antidote
  label: 毒消し
  type: consumable
  effect:
    - immediate:
        clearEffect: poison
    - immediate:
        life: 10
  description: 毒状態を消し、わずかに体力も回復する
- name: double attack scroll
  label: 2回攻撃の巻物
  type: consumable
  effect:
    immediate:
      learnSkill: double_attack
  description: 唱えるとスキル「2回攻撃」を習得する
- name: heal scroll
  label: 自己治癒の巻物
  type: consumable
  effect:
    immediate:
      learnSkill: self_heal
      life: 10
  description: 唱えるとスキル「自己治癒」を習得し、わずかに体力も回復する
- name: anti-poison ring
  label: 解毒の指輪
  type: sub_armor
  effect:
    defense: 2
    resist: [poison]
  description: 装備中は毒状態にならない指輪
- name: stun guard potion
  label: 麻痺除けの薬
  type: consumable
  effect:
    continuous:
      turns: 10
      resist: [stun]
  description: しばらくの間、麻痺状態にならなくなる薬
