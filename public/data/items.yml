- name: iron sword
  label: 鉄の剣
  type: weapon
  effect:
    power: 15
  description: 一般的な鉄の剣
- name: round shield
  label: 丸い盾
  type: main_armor
  effect:
    defense: 10
  description: 丸い板を鉄で補強した盾
- name: silver ring
  label: 銀の指輪
  type: sub_armor
  effect:
    defense: 10
  description: 銀でできた綺麗な指輪
- name: potion
  label: 薬
  type: consumable
  effect:
    immediate:
      life: 30
  description: 傷を治す薬
- name: mana potion
  label: 魔法の薬
  type: consumable
  effect:
    immediate:
      magic: 30
  description: MPを回復する薬
- name: power potion
  label: 力の薬
  type: consumable
  effect:
    continuous:
      turns: 5
      power: 10
  description: 一時的に力を高める薬
- name: weakening potion
  label: 弱体の薬
  type: consumable
  effect:
    continuous:
      turns: 5
      power: -5
      defense: -5
  description: 投げつけた相手の力と守りを一時的に下げる薬
- name: poison potion
  label: 毒薬
  type: consumable
  effect:
    immediate:
      applyEffect: poison
  description: 飲むと毒状態になる怪しい瓶
- name: antidote
  label: 毒消し
  type: consumable
  effect:
    - immediate:
        clearEffect: poison
    - immediate:
        life: 10
  description: 毒状態を消し、わずかに体力も回復する
- name: double attack scroll
  label: 2回攻撃の巻物
  type: consumable
  effect:
    immediate:
      learnSkill: double_attack
  description: 唱えるとスキル「2回攻撃」を習得する
- name: heal scroll
  label: 自己治癒の巻物
  type: consumable
  effect:
    immediate:
      learnSkill: self_heal
      life: 10
  description: 唱えるとスキル「自己治癒」を習得し、わずかに体力も回復する
- name: anti-poison ring
  label: 解毒の指輪
  type: sub_armor
  effect:
    defense: 2
    resist: [poison]
  description: 装備中は毒状態にならない指輪
- name: stun guard potion
  label: 麻痺除けの薬
  type: consumable
  effect:
    continuous:
      turns: 10
      resist: [stun]
  description: しばらくの間、麻痺状態にならなくなる薬
- name: power scroll
  label: 攻撃強化の巻物
  type: consumable
  effect:
    immediate:
      add_modifier: power_reinforced
  description: 装備中の武器に「攻撃強化」を付与する巻物
- name: weakness scroll
  label: 攻撃弱化の巻物
  type: consumable
  effect:
    immediate:
      add_modifier: power_weakened
  description: 装備中の武器に「攻撃弱化」を付与してしまう怪しい巻物
- name: uncurse scroll
  label: 解呪の巻物
  type: consumable
  effect:
    immediate:
      remove_modifier_kind:
        kind: curse
        target: all_equipped
  description: 装備中の全アイテムから呪いを解く巻物
- name: explosion scroll
  label: 爆発の巻物
  type: consumable
  effect:
    immediate:
      executeSkill: explosion
  description: 唱えるとスキル「爆発」が発動し、部屋全体に大ダメージを与える
- name: throwing flask
  label: 火炎瓶
  type: consumable
  effect:
    immediate:
      life: 5
  throwEffect:
    - damage: "20 + power - target_defense / 2"
  description: 投げつけると割れて爆発する瓶。飲んでもわずかに体力が回復するだけ
- name: throwing glove
  label: 投擲手袋
  type: sub_armor
  effect:
    defense: 1
    throwRange: 2
  description: 装備するとアイテムを少し遠くまで投げられるようになる手袋
- name: spiked shield
  label: トゲ付きの盾
  type: main_armor
  effect:
    defense: 8
  throwEffect:
    - damage: "15 + power - target_defense / 2"
    - apply_effect: { effect: poison, rate: 0.3 }
  description: トゲが付いた盾。投げつけても相手を傷つけ、毒を与えることがある
