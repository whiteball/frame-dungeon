- name: poison
  label: 毒
  description: 徐々にダメージを受ける
  timing:
    onTurnEnd:
      target: life
      formula: "(x - 5) <= 0 ? 1 : (x - 5)"
  clear:
    formula: "(count ^ 2) * 0.01"
- name: unfocused
  label: 散漫
  description: 徐々にMPが減る
  timing:
    onTurnEnd:
      target: magic
      formula: "x - 1"
  clear:
    formula: "(count ^ 2) * 0.01"
- name: stun
  label: 麻痺
  description: 1ターン動けない
  timing:
    onAction:
      target: _action
      value: skip
  clear:
    formula: "count > 1 ? 1 : 0"
- name: sleep
  label: 睡眠
  description: しばらく動けない
  timing:
    onAction:
      target: _action
      value: skip
  clear:
    formula: "(count ^ 2) * 0.05"
    onDamage: true
- name: fear
  label: 恐怖
  description: 攻撃力が下がる
  timing:
    permanent:
      target: power
      formula: "x * 0.6"
  clear:
    formula: "(count ^ 2) * 0.01"
- name: frail
  label: 虚弱
  description: 防御力が下がる
  timing:
    permanent:
      target: defense
      formula: "x * 0.4"
  clear:
    formula: "(count ^ 2) * 0.01"
- name: powerful
  label: 元気はつらつ
  description: 攻撃力と防御力が上がる
  timing:
    permanent:
      - target: power
        formula: "x * 1.2"
      - target: defense
        formula: "x * 1.2"
  clear:
    formula: "(count ^ 2) * 0.1"
# 遅延効果（時限爆弾型）の例: 付与中は何も起きないが、満了すると 1 回だけ effect が発動する。
# - clear.formula を確率式ではなく閾値式 `count >= N ? 1 : 0` にしてカウントダウンにする
# - onExpire は満了（clear.formula 由来の自然解除）時のみ発火する。治療（clearEffect アイテム）
#   や被弾解除（clear.onDamage）では発火しないため「何もしなければ N ターン後に発動／治療で回避」になる
# - 発火する効果は events.yml の action を再利用する（ここでは death_curse_payload で HP/MP を 1 にする）
- name: death_curse
  label: 死の呪い
  description: 解けないと約30ターン後に生命力を奪われる
  timing: {}
  clear:
    formula: "count >= 30 ? 1 : 0"
  onExpire: death_curse_payload
# 行動強制（force）の例: 混乱。onAction.value にアクションのリストを与えると、状態異常ごとの
# actionIndex（0 起点）で順に選ばれる。リスト長を超えると末尾要素を繰り返す。末尾が repeat なら
# そのサブリストを巡回する。force 系は移動キー等の入力を上書きしてターンを消費する。
- name: confuse
  label: 混乱
  description: 意のままに動けず、勝手に行動してしまう
  timing:
    onAction:
      target: _action
      value:
        - [skip, "ぼーっとしている"]
        - attack
        - [repeat, [move, attack_self]]
  clear:
    formula: "(count ^ 2) * 0.03"
    onDamage: true
# 行動禁止（forbid）の例: 拘束。not_* は一部カテゴリの入力を拒否する（ターン非消費）。
# 引数付き単一アクションは、配列リテラル誤読を避けるため必ずリスト要素（- ...）で書く。
- name: bound
  label: 拘束
  description: 足を捕らえられて動けない（攻撃やアイテムは可能）
  timing:
    onAction:
      target: _action
      value:
        - [not_move, "拘束されていて動けない！"]
  clear:
    formula: "(count ^ 2) * 0.05"
