- name: double_attack
  label: 2回攻撃
  description: 1ターンで2回攻撃する
  target: front
  cost:
    magic: 2
  action:
    - attack
    - attack
  mastery:
    - exact: 2

- name: explosion
  label: 爆発
  description: 部屋全体に大ダメージを与える
  target: room
  cost:
    life: life * 0.1
    magic: magic_max * 0.2
  action:
    - damage: 30
  mastery:
    - least: 5
      rate: 0.5

- name: self_heal
  label: 自己治癒
  description: 自分のHPを回復する
  target: self
  cost:
    magic: 5
  action:
    - heal: 30

- name: scan_room
  label: 部屋探知
  description: 同じ部屋内のトラップを発見する
  target: room
  cost:
    magic: 3
  action:
    - reveal_trap
  mastery:
    - least: 3
      rate: 0.2
    - least: 5
      rate: 0.5

# 遠距離スキル（target: straight）：選んだ方向の射線上、最初の敵を対象にする。
# 壁・扉・宝箱などで射線が止まり、その先の敵は狙えない。射線上に敵がいなければ
# コスト・ターン非消費で空振りになる。
- name: toxic_dart
  label: 毒矢
  description: 射線上の最初の敵に毒矢を放ち、毒状態を付与する（確率60%）
  target: straight
  cost:
    magic: 3
  action:
    - apply_effect:
        effect: poison
        rate: 0.6
  mastery:
    - least: 2
      rate: 0.4

- name: magic_arrow
  label: 魔法の矢
  description: 射線上の最初の敵を魔力の矢で射抜く（遠距離ダメージ）
  target: straight
  cost:
    magic: 4
  action:
    - damage: "power - target_defense / 2"
  mastery:
    - least: 2
      rate: 0.3

- name: analyze
  label: 分析
  description: 敵の詳細情報を表示する
  target: front
  cost:
    magic: 1
  action:
    - analyze
  mastery:
    - exact: 3

# プレイヤー側パッシブスキル群
- name: critical_strike
  label: 会心
  description: 通常攻撃時に攻撃力相当の追加ダメージを与える
  trigger: on_attack
  target: hit
  action:
    - damage: "power"

- name: meditate
  label: 瞑想
  description: 毎ターン魔力を1消費して体力を3回復する
  trigger: on_turn
  target: self
  toggle: yes
  cost:
    magic: 1
  action:
    - heal: 3

- name: thorns
  label: 棘の鎧
  description: 被ダメージ時、攻撃元に受けたダメージの半分を反射する
  trigger: on_damage
  target: hit
  action:
    - damage: "incoming_damage * 0.5"

- name: vigor
  label: 活力
  description: 攻撃力・体力上限が常時上昇する
  trigger: passive
  add_stats:
    power: 3
    life_max: "level * 2"

# 敵専用パッシブスキル（trigger: on_attack）
- name: stun_strike
  label: スタン打撃
  description: 攻撃時にスタン状態にすることがある
  trigger: on_attack
  target: hit
  action:
    - apply_effect:
        effect: stun
        rate: 1.0

- name: fear_strike
  label: 恐怖の一撃
  description: 攻撃時に恐怖状態にすることがある
  trigger: on_attack
  target: hit
  action:
    - apply_effect:
        effect: fear
        rate: 1.0

- name: poison_bite
  label: 毒噛み
  description: 攻撃時に毒状態にすることがある
  trigger: on_attack
  target: hit
  action:
    - apply_effect:
        effect: poison
        rate: 1.0

# 遅延効果（onExpire 時限爆弾型）の付与スキル例。
# enemies.yml の敵に skills: [{ name: curse_strike, rate: 0.x }] で持たせると
# 「呪い攻撃を受け、何もしなければ約30ターン後にHP/MPが1になる（治療で回避可）」を実現する。
- name: curse_strike
  label: 呪いの一撃
  description: 攻撃時に死の呪いを付与することがある
  trigger: on_attack
  target: hit
  action:
    - apply_effect:
        effect: death_curse
        rate: 1.0
