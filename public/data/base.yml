name: Sample Game
goalFloor: 10

defaultDamageStat: life

dead:
  use:
    - life
  formula: life <= 0

defaultEnemyDamageStat: life

enemyDead:
  use:
    - life
  formula: life <= 0

damageToPlayer:
  player:
    use:
      - defense
  enemy:
    use:
      - power
  formula: enemy_power - player_defense / 2

damageFromPlayer:
  player:
    use:
      - power
  enemy:
    use:
      - defense
  formula: player_power - enemy_defense / 2

requiredExp:
  use:
    - level
  formula: level * 50

levelUpBonus:
  - target: life
    formula: 10
    reset: yes
  - target: magic
    formula: 5
    reset: yes
  - target: power
    formula: 2
  - target: defense
    formula: 1

autoSpawner:
  use:
    - currentFloor
    - life
  formula: "currentFloor <= 2 ? life <= 40 : (currentFloor <= 5 ? life <= 60 : currentFloor <= 9 ? life <= 100 : true)"

floors:
  - 1:
      size: 15
      enemyCount: 4
      enemies:
        - slime
        - bat
        - goblin
      trapCount: 0
      traps:
      # アイテム床配置時に 15% の確率で modifier を付与（item_modifiers.yml の weight で抽選）
      itemModifierChance: 0.15
      secretRoom: yes
  - 4:
      size:
        w: 15
        h: 20
      enemyCount: 6
      enemies:
        - skeleton
        - wolf
        - spider
      trapCount: 4
      traps:
        - spike
      itemModifierChance: 0.25
      # フロア共通の敵ドロップ。enemies.yml の drop に additive
      enemyDropPool:
        - item: potion
          rate: 0.05
        - item: mana potion
          rate: 0.05
  - 7:
      size:
        w: 20
        h: 25
      enemyCount: 8
      enemies:
        - orc
        - spider
        - name: ogre
          count: 1
      trapCount:
        min: 6
        max: 8
      traps:
        - spike
        - swamp
      # 強化系を出やすくし、弱化系を出にくくするサンプル設定
      itemModifierChance: 0.4
      itemModifierPool:
        power_reinforced: 3
        defense_reinforced: 3
        power_weakened: 1
        defense_weakened: 1
        cursed: 2
      enemyDropPool:
        - item: potion
          rate: 0.08
        - item: power scroll
          rate: 0.05
        - item: uncurse scroll
          rate: 0.03
  - 10:
      size: 30
      enemyCount: 12
      enemies:
        - orc
        - ogre
        - spider
        - name: dragon
          count: 1
      trapCount:
        min: 8
        max: 10
      traps:
        - spike
        - swamp
        - strip
      itemModifierChance: 0.5
