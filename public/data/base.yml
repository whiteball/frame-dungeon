name: Sample Game
goalFloor: 10

playerInitialStats:
  life: 100
  magic: 50
  power: 10
  defense: 5
  karma: 50

defaultDamageStat: life

dead:
  use:
    - life
  formula: life <= 0

defaultEnemyDamageStat: life

enemyDead:
  use:
    - life
  formula: life <= 0

damageToPlayer:
  player:
    use:
      - defense
  enemy:
    use:
      - power
  formula: enemy_power - player_defense / 2

damageFromPlayer:
  player:
    use:
      - power
  enemy:
    use:
      - defense
  formula: player_power - enemy_defense / 2

requiredExp:
  use:
    - level
  formula: level * 50

levelUpBonus:
  - target: life
    formula: 10
    reset: yes
  - target: magic
    formula: 5
    reset: yes
  - target: power
    formula: 2
  - target: defense
    formula: 1

autoSpawner:
  use:
    - currentFloor
    - life
  formula: "currentFloor <= 2 ? life <= 40 : (currentFloor <= 5 ? life <= 60 : currentFloor <= 9 ? life <= 100 : true)"

# 一定ターンごとに自動回復させるステータス
# 各エントリは target / turn / formula を持ち、turnCount % turn == 0 のターンに formula 評価値を addStat する
# formula 内では各ステータスの実効値と <stat>_max を参照可能
regenerate:
  - target: life
    turn: 10
    formula: "floor(life_max * 0.01) <= 0 ? 1 : floor(life_max * 0.01)"
  - target: magic
    turn: 30
    formula: "floor(magic_max * 0.01) <= 0 ? 1 : floor(magic_max * 0.01)"

# 時限イベント: events.yml のイベントをターン経過トリガーで発火する
# - event:  発火する events.yml のイベント名（action / random_outcome のみ。choices は不可）
# - turn:   発火する経過ターン数（正の整数）
# - repeat: yes なら turn の倍数ごとに繰り返し発火 / no（既定）なら turn ちょうどで 1 回だけ
# - scope:  global（既定, 通算ターン） / floor（フロア入場からの経過ターン。フロア移動でリセット）
# 既定バランスを変えないため既定では無効。下記をアンコメントすると 30 ターンごとに鳴動イベントが起きる
# scheduledEvents:
#   - event: dungeon_tremor
#     turn: 30
#     repeat: yes
#     scope: global

# 同一フロアへの長居警告/強制移動
# longStay は3要素配列で、それぞれ 50% 警告 / 75% 警告 / 100% 強制移動時のメッセージ
# longStayFactor はフロアセル数 (width*height) に掛ける倍率で、規定ターン数を算出
# 個別フロアで longStayTurns を指定するとそちらが優先される
longStay:
  - 風が吹いてきた……。
  - 風が強い。早く次の階に移動しなければ。
  - 強風によって次の階に吹き飛ばされた！
longStayFactor: 4

# アイテム投擲の基準射程（セル数）。0 以下または未指定で無制限。
# 実効射程はこの値に装備/パッシブスキルの throwRange ボーナスを加算したもの（無制限時はボーナス無効）。
throwRange: 5

floors:
  - 1:
      size: 15
      enemyCount: 4
      enemies:
        - slime
        - bat
        - goblin
      trapCount: 0
      traps:
      # アイテム床配置時に 15% の確率で modifier を付与（item_modifiers.yml の weight で抽選）
      itemModifierChance: 0.15
      secretRoom: yes
      # 隠し部屋扉のバリアント抽選重み（plain=壁偽装 / locked=施錠 / lockedDisguised=偽装＋施錠）
      # 未指定または全 0 のとき均等 1/3 がフォールバックされる
      secretRoomDoorVariants:
        plain: 1
        locked: 1
        lockedDisguised: 1
  - 4:
      size:
        w: 15
        h: 20
      enemyCount: 6
      enemies:
        - skeleton
        - wolf
        - spider
      trapCount: 4
      traps:
        - spike
        - healing_pad
      eventCount:
        min: 1
        max: 2
      events:
        - healing_fountain
        - mysterious_altar
        - heavy_rock
        - tempting_chest
        - wounded_animal
        - ancient_inscription
      itemModifierChance: 0.25
      secretRoom: yes
      # フロア 4 以降は施錠系を増やす（探索難度上昇）
      secretRoomDoorVariants:
        plain: 1
        locked: 2
        lockedDisguised: 2
      # フロア共通の敵ドロップ。enemies.yml の drop に additive
      enemyDropPool:
        - item: potion
          rate: 0.05
        - item: mana potion
          rate: 0.05
      # 隠し部屋に出現する宝箱。rate で出現有無、trapRate で開封時のトラップ発動を判定する
      treasure:
        rate: 0.5
        trapRate: 0.5
        items:
          - name: iron sword
            modifiers:
              - name: power_reinforced
                count: 2
            bias: 3
          - name: round shield
            modifiers:
              - name: defense_reinforced
                count: 2
            bias: 2
  - 7:
      size:
        w: 20
        h: 25
      enemyCount: 8
      enemies:
        - orc
        - spider
        - name: ogre
          count: 1
      trapCount:
        min: 6
        max: 8
      traps:
        - spike
        - swamp
      # 強化系を出やすくし、弱化系を出にくくするサンプル設定
      itemModifierChance: 0.4
      itemModifierPool:
        power_reinforced: 3
        defense_reinforced: 3
        power_weakened: 1
        defense_weakened: 1
        cursed: 2
      enemyDropPool:
        - item: potion
          rate: 0.08
        - item: power scroll
          rate: 0.05
        - item: uncurse scroll
          rate: 0.03
  - 10:
      size: 30
      enemyCount: 12
      enemies:
        - orc
        - ogre
        - spider
        - name: dragon
          count: 1
      trapCount:
        min: 8
        max: 10
      traps:
        - spike
        - swamp
        - strip
      itemModifierChance: 0.5
