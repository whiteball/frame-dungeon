name: Sample Game
goalFloor: 10

defaultDamageStat: life

dead:
  use:
    - life
  formula: life <= 0

defaultEnemyDamageStat: life

enemyDead:
  use:
    - life
  formula: life <= 0

damageToPlayer:
  player:
    use:
      - defense
  enemy:
    use:
      - power
  formula: enemy_power - player_defense / 2

damageFromPlayer:
  player:
    use:
      - power
  enemy:
    use:
      - defense
  formula: player_power - enemy_defense / 2

requiredExp:
  use:
    - level
  formula: level * 50

levelUpBonus:
  - target: life
    formula: 10
    reset: yes
  - target: power
    formula: 2
  - target: defense
    formula: 1

autoSpawner:
  use:
    - currentFloor
    - life
  formula: "currentFloor <= 2 ? life <= 40 : (currentFloor <= 5 ? life <= 60 : currentFloor <= 9 ? life <= 100 : true)"

floors:
  - 1:
      size: 15
      enemyCount: 4
      enemies:
        - slime
        - bat
        - goblin
      trapCount: 0
      traps:
  - 4:
      size:
        w: 15
        h: 20
      enemyCount: 6
      enemies:
        - skeleton
        - wolf
        - spider
      trapCount: 4
      traps:
        - spike
  - 7:
      size:
        w: 20
        h: 25
      enemyCount: 8
      enemies:
        - orc
        - spider
        - name: ogre
          count: 1
      trapCount:
        min: 6
        max: 8
      traps:
        - spike
        - swamp
  - 10:
      size: 30
      enemyCount: 12
      enemies:
        - orc
        - ogre
        - spider
        - name: dragon
          count: 1
      trapCount:
        min: 8
        max: 10
      traps:
        - spike
        - swamp
        - strip
